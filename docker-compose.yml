services:
  db:
    image: postgres:16
    container_name: smart-helpdesk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      ML_MODEL_PATH: /app/ml/artifacts/classifier.joblib
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend/ml/artifacts:/app/ml/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
